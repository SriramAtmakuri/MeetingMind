version: "3.9"

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: meetingmind-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: meetingmind
      POSTGRES_USER: meetingmind
      POSTGRES_PASSWORD: meetingmind_dev
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U meetingmind -d meetingmind"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: meetingmind-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: meetingmind-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      NODE_ENV: development
      PORT: 3001
      DATABASE_URL: postgres://meetingmind:meetingmind_dev@postgres:5432/meetingmind
      REDIS_URL: redis://redis:6379
      FRONTEND_URL: http://localhost:8080
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      SENTRY_DSN: ${SENTRY_DSN:-}
    ports:
      - "3001:3001"
    volumes:
      - ./uploads:/app/uploads
      - ./storage:/app/storage

volumes:
  postgres_data:
  redis_data:
